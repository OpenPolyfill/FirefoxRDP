<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="data:," />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/satoshi-400.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- Self-hosted (see static/katex/), not loaded from a CDN, matching the
		     Satoshi font. Small enough (~7KB gzipped) to load globally rather
		     than conditionally per-page. -->
		<link rel="stylesheet" href="%sveltekit.assets%/katex/katex.min.css" />
		<style>
			@font-face {
				font-family: 'Satoshi';
				src: url('%sveltekit.assets%/fonts/satoshi-400.woff2') format('woff2');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'Satoshi';
				src: url('%sveltekit.assets%/fonts/satoshi-500.woff2') format('woff2');
				font-weight: 500;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'Satoshi';
				src: url('%sveltekit.assets%/fonts/satoshi-700.woff2') format('woff2');
				font-weight: 700;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'Satoshi';
				src: url('%sveltekit.assets%/fonts/satoshi-900.woff2') format('woff2');
				font-weight: 900;
				font-style: normal;
				font-display: swap;
			}
		</style>
		<script>
      (function () {
        var options = ['ayu-light', 'ayu-dark', 'ayu-mirage', 'ayu-evolve'];
        var selected = 'ayu-dark';
        try {
          var saved = localStorage.getItem('openpolyfill-ayu-theme');
          if (options.includes(saved)) selected = saved;
          else if (localStorage.getItem('svocs-theme') === 'light' ||
                   window.matchMedia('(prefers-color-scheme: light)').matches) selected = 'ayu-light';
        } catch (e) { /* storage may be disabled */ }
        document.documentElement.dataset.ayu = selected;
        document.documentElement.dataset.theme = selected === 'ayu-light' ? 'light' : 'dark';
      })();
    </script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
