name: Publish package

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-publish
  cancel-in-progress: false

jobs:

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.17
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install npm version that supports trusted publishing
        run: npm install --global npm@11.5.1


      - name: Install dependencies
        run: npm ci
      - name: Verify package
        run: npm run verify


      - name: Publish to npmjs
        run: npm publish --registry=https://registry.npmjs.org --access public

  publish-github:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.17
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
      - name: Verify package
        run: npm run verify


      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

